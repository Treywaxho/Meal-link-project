<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Meal Link Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .dashboard-layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: calc(100vh - 70px);
            /* Minus navbar height */
        }

        .sidebar {
            background: var(--bg-card);
            border-right: 1px solid rgba(0, 0, 0, 0.05);
            padding: 30px 20px;
            backdrop-filter: blur(10px);
        }

        :root.dark-theme .sidebar {
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-menu li {
            margin-bottom: 10px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 15px;
            border-radius: var(--border-radius);
            color: var(--text-muted);
            transition: all var(--transition-fast);
            font-weight: 500;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: rgba(255, 107, 0, 0.1);
            color: var(--primary-color);
        }

        .dashboard-content {
            padding: 30px;
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.02) 0%, rgba(30, 30, 30, 0.02) 100%);
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .stat-info h3 {
            font-size: 2rem;
            margin: 0;
            color: var(--secondary-color);
        }

        :root.dark-theme .stat-info h3 {
            color: var(--text-light);
        }

        .stat-info p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Mobile Adjustments */
        @media (max-width: 900px) {
            .dashboard-layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
                /* In a real app, make this a sliding drawer */
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="navbar-brand">
                <i class="fas fa-utensils"></i> Meal Link
            </a>
            <div class="hamburger">
                <div></div>
                <div></div>
                <div></div>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="dashboard.html" class="nav-link active" id="dashboard-link">Dashboard</a>
                <span id="user-greeting" class="nav-link" style="font-weight: 600; color: var(--primary-color);"></span>
                <a href="#" class="nav-link" id="logout-btn">Logout</a>
                <button id="theme-toggle" class="btn btn-outline" style="padding: 5px 10px; border-radius: 50%;"><i
                        class="fas fa-moon"></i></button>
            </div>
        </div>
    </nav>

    <!-- Dashboard Layout Container -->
    <div class="dashboard-layout">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="mb-2 text-center" id="sidebar-profile">
                <div
                    style="width: 80px; height: 80px; background: rgba(255,107,0,0.2); border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: var(--primary-color);">
                    <i class="fas fa-user"></i>
                </div>
                <h4 id="profile-name">Loading...</h4>
                <p class="text-muted" style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;"
                    id="profile-role">ROLE</p>
            </div>

            <!-- Dynamic Sidebar Menu Container -->
            <ul class="sidebar-menu" id="sidebar-menu-container">
                <!-- Nav items injected via JS based on role -->
            </ul>
        </aside>

        <!-- Main Content Area -->
        <main class="dashboard-content">

            <div class="dashboard-header fade-in">
                <div>
                    <h2>Dashboard Overview</h2>
                    <p class="text-muted" id="dashboard-date"></p>
                </div>
                <!-- Dynamic Quick Action Button -->
                <div id="quick-action-container"></div>
            </div>

            <!-- Dynamic Content Container -->
            <div id="dashboard-main-content">
                <!-- Dashboard grids injected via JS -->
            </div>

        </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container"></div>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/dashboard.js"></script>
</body>

</html>
