<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Meal Link Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.1) 0%, rgba(30, 30, 30, 0.05) 100%);
        }

        .auth-card {
            width: 100%;
            max-width: 500px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header i {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="glass-card auth-card slide-up">
            <div class="auth-header">
                <i class="fas fa-user-plus"></i>
                <h2>Create Account</h2>
                <p class="text-muted">Join the NUST Digital Dining Platform</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <input type="text" class="form-control" id="fullName" placeholder=" " required autocomplete="name">
                    <label class="floating-label">Full Name</label>
                    <div class="invalid-feedback">Full Name is required</div>
                </div>

                <div class="form-group">
                    <input type="email" class="form-control" id="email" placeholder=" " required autocomplete="email">
                    <label class="floating-label">Email Address / Student ID</label>
                    <div class="invalid-feedback">Valid Email is required</div>
                </div>

                <div class="form-group">
                    <select class="form-control" id="role" style="color: var(--text-main);" required>
                        <option value="" disabled selected hidden>Select Role</option>
                        <option value="student">Student</option>
                        <option value="vendor">Vendor</option>
                        <option value="admin">Administrator (Demo)</option>
                    </select>
                </div>

                <div class="form-group">
                    <input type="password" class="form-control" id="password" placeholder=" " required
                        autocomplete="new-password">
                    <label class="floating-label">Password</label>
                    <div class="invalid-feedback">Password must be at least 6 characters</div>
                </div>

                <div class="form-group">
                    <input type="password" class="form-control" id="confirmPassword" placeholder=" " required
                        autocomplete="new-password">
                    <label class="floating-label">Confirm Password</label>
                    <div class="invalid-feedback">Passwords do not match</div>
                </div>

                <button type="submit" class="btn btn-primary btn-block pulse" id="register-btn"
                    style="animation-play-state: paused;">Register Now</button>

                <p class="text-center mt-2 text-muted" style="margin-bottom: 0;">
                    Already have an account? <a href="login.html">Login</a>
                </p>
            </form>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container"></div>
    <script type="module" src="js/auth.js"></script>
</body>

</html>
